<!viccks chat html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viccks Chat - Ghana 🇬🇭</title>
<link rel="icon" href="logo.jpg">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#111b21;color:white;display:flex;height:100vh;overflow:hidden}
#sidebar{width:32%;min-width:280px;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column}
.top{background:#202c33;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;height:60px}
.avatar{width:40px;height:40px;border-radius:50%;background:#25D366;display:grid;place-items:center;font-weight:900;object-fit:cover}
.avatar-big{width:80px;height:80px;border-radius:50%;background:#111b21;display:grid;place-items:center;font-size:30px;border:2px solid #25D366;object-fit:cover}
.userList{flex:1;overflow-y:auto}.user{padding:12px 15px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #202c33;cursor:pointer}
.user:hover{background:#202c33}.user.active{background:#2a3942}
#messages{flex:1;overflow-y:auto;padding:15px;background:#0b141a}
.msg{max-width:75%;padding:8px 12px;border-radius:10px;margin-bottom:8px;font-size:14px;word-break:break-word}
.mine{background:#005c4b;margin-left:auto}.theirs{background:#202c33}
.msg img{max-width:220px;border-radius:8px;margin-top:6px;display:block}.msg audio{margin-top:6px;width:210px}
.del{color:#ff5a5a;cursor:pointer;font-size:11px;margin-left:8px}
.bar{background:#202c33;padding:8px 12px;display:flex;gap:8px;align-items:center}
.bar input{flex:1;background:#2a3942;border:none;padding:12px 15px;border-radius:25px;color:white;outline:none}
.iconBtn{background:#2a3942;border:none;color:#aebac1;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:18px;display:grid;place-items:center}
.sendBtn{background:#25D366;border:none;width:45px;height:45px;border-radius:50%;cursor:pointer}
#login{position:fixed;inset:0;background:#0a1014;display:grid;place-items:center;z-index:100}
.box{background:#202c33;padding:25px;border-radius:15px;width:88%;max-width:400px}
.box input{width:100%;padding:12px;margin:8px 0;background:#2a3942;border:none;border-radius:8px;color:white}
.box label{font-size:11px;color:#8696a0;display:block;margin-top:8px}
.btn{width:100%;background:#25D366;border:none;padding:13px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:12px;color:#111b21}
.btn2{width:100%;background:#2a3942;border:none;padding:12px;border-radius:8px;color:white;cursor:pointer;margin-top:8px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:300;place-items:center;padding:20px}
.badge{background:#25D366;padding:4px 8px;border-radius:10px;font-size:10px;color:#111b21;font-weight:bold}
small.muted{color:#8696a0}hr{border:none;border-top:1px solid #2a3942;margin:12px 0}
.logo{width:90px;height:90px;border-radius:20px;box-shadow:0 5px 20px rgba(37,211,102,0.4)}
</style>
</head>
<body>
<div id="login"><div class="box"><center><img src="logo.jpg" class="logo"><h2 style="margin:10px 0 4px;">Viccks Chat</h2><p class="muted" style="font-size:12px;">Ghana's Real Chat • bongolinnat@gmail.com</p></center><label>Name (Type Viccks for Admin)</label><input id="userName" placeholder="Viccks"><label>Bio</label><input id="userBio" placeholder="Available | Adum Kumasi"><label>Profile Pic</label><input type="file" id="picInput" accept="image/*"><div style="margin-top:10px;display:flex;gap:10px;align-items:center;"><img id="loginPreview" class="avatar" style="display:none;"><small class="muted">Preview</small></div><button class="btn" onclick="joinPro()">JOIN VICCKS CHAT 🚀</button></div></div>

<div id="sidebar"><div class="top"><div style="display:flex;gap:10px;align-items:center;overflow:hidden;"><img id="myAvatar" class="avatar"><div><b id="myNameDisplay"></b><br><small id="myBioDisplay" class="muted" style="font-size:11px;"></small></div></div><div style="display:flex;gap:5px;"><button class="iconBtn" onclick="openSettings()">✏️</button><button class="iconBtn" onclick="toggleAdmin()">⚙️</button></div></div><div style="padding:10px 15px;background:#182229;display:flex;gap:8px;align-items:center;"><img src="logo.jpg" style="width:22px;height:22px;border-radius:6px;"><small class="muted">Viccks Chat • Private Chat 🔒</small></div><div class="userList" id="userList"></div><div style="padding:10px;background:#202c33;text-align:center;"><small class="muted">Made in Ghana 🇬🇭 with logo</small></div></div>

<div id="main"><div class="top"><div style="display:flex;gap:10px;align-items:center;"><img src="logo.jpg" style="width:32px;height:32px;border-radius:8px;"><div><b id="chatTitle">Group Chat 🇬🇭</b><br><small id="chatStatus" style="color:#25D366;">● Online • Real time</small></div></div><div style="display:flex;gap:6px;"><div id="privateBadge" style="display:none;" class="badge">PRIVATE 🔒</div><button class="iconBtn" onclick="openSettings()">👤</button></div></div><div id="messages"></div><div class="bar"><label class="iconBtn">📷<input type="file" id="imgFile" accept="image/*" style="display:none"></label><button class="iconBtn" id="micBtn" onclick="toggleVoice()">🎤</button><input id="msgInput" placeholder="Type a message..."><button class="sendBtn" onclick="sendPro()">➤</button></div></div>

<div id="adminPanel" class="modal"><div class="box"><b>👑 Admin — Viccks Only</b><hr><button class="btn" style="background:#ff4444;color:white;" onclick="clearAllChat()">Clear Group</button><button class="btn2" onclick="toggleAdmin()">Close</button></div></div>
<div id="settingsModal" class="modal"><div class="box"><h3>✏️ Edit Profile</h3><p class="muted" style="font-size:12px;">Change name, bio, pic anytime</p><label>Name</label><input id="editName"><label>Bio</label><input id="editBio"><label>Picture</label><input type="file" id="editPic" accept="image/*"><div style="margin:12px 0;display:flex;gap:12px;align-items:center;"><img id="previewPic" class="avatar-big"><div><b id="previewName">Name</b><br><small id="previewBio" class="muted">Bio</small></div></div><button class="btn" onclick="saveSettings()">Save ✅</button><button class="btn2" onclick="closeSettings()">Cancel</button><hr><button class="btn2" style="color:#ff5a5a;" onclick="logout()">Logout</button></div></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const cfg={databaseURL:"https://viccks-demo-chat-default-rtdb.firebaseio.com"};firebase.initializeApp(cfg);const db=firebase.database();
let myName="",myPic="",myBio="",currentChat="group",isAdmin=false,mediaRecorder,audioChunks=[];
document.getElementById("picInput").addEventListener("change",function(){let f=this.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{let el=document.getElementById("loginPreview");el.src=e.target.result;el.style.display="grid";el.dataset.temp=e.target.result;};r.readAsDataURL(f);});
function joinPro(){myName=document.getElementById("userName").value.trim();myBio=document.getElementById("userBio").value.trim()||"Available";if(!myName)return alert("Enter name");isAdmin=myName.toLowerCase()==="viccks";myPic=document.getElementById("loginPreview").dataset.temp||"";finishJoin();}
function finishJoin(){localStorage.setItem("viccks_name",myName);localStorage.setItem("viccks_bio",myBio);if(myPic)localStorage.setItem("viccks_pic",myPic);document.getElementById("login").style.display="none";document.getElementById("myNameDisplay").innerText=myName;document.getElementById("myBioDisplay").innerText=myBio;let av=document.getElementById("myAvatar");if(myPic)av.src=myPic;else av.innerHTML=myName[0].toUpperCase();db.ref("viccks_users/"+myName).set({name:myName,pic:myPic,bio:myBio,online:true});listenUsers();listenMessages();}
function listenUsers(){db.ref("viccks_users").on("value",snap=>{let html=`<div class="user ${currentChat==='group'?'active':''}" onclick="selectChat('group')"><div class="avatar" style="background:#25D366;">G</div><div><b>Group Chat 🇬🇭</b><br><small class="muted">${snap.numChildren()} online</small></div></div>`;snap.forEach(c=>{let u=c.val();if(!u.name||u.name===myName)return;html+=`<div class="user ${currentChat===u.name?'active':''}" onclick="selectChat('${u.name.replace(/'/g,"\\'")}')">${u.pic?`<img class="avatar" src="${u.pic}">`:`<div class="avatar">${u.name[0].toUpperCase()}</div>`}<div><b>${u.name}</b><br><small class="muted">${u.bio||''}</small></div></div>`;});document.getElementById("userList").innerHTML=html;});}
function selectChat(n){currentChat=n;document.getElementById("chatTitle").innerText=n==="group"?"Group Chat 🇬🇭":n+" (Private) 🇬🇭";document.getElementById("privateBadge").style.display=n==="group"?"none":"block";document.getElementById("messages").innerHTML="";listenMessages();}
function sendPro(){let t=document.getElementById("msgInput").value.trim();if(!t)return;let p=currentChat==="group"?"viccks_pro_group":"viccks_pro_private_"+[myName,currentChat].sort().join("_").replace(/[^a-zA-Z0-9_]/g,"_");db.ref(p).push({name:myName,pic:myPic,bio:myBio,text:t,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});document.getElementById("msgInput").value="";}
document.getElementById("imgFile").addEventListener("change",function(){let f=this.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{let p=currentChat==="group"?"viccks_pro_group":"viccks_pro_private_"+[myName,currentChat].sort().join("_").replace(/[^a-zA-Z0-9_]/g,"_");db.ref(p).push({name:myName,pic:myPic,text:"📷 Image",img:e.target.result,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});};r.readAsDataURL(f);this.value="";});
async function toggleVoice(){let b=document.getElementById("micBtn");if(mediaRecorder&&mediaRecorder.state==="recording"){mediaRecorder.stop();b.innerText="🎤";b.style.background="#2a3942";}else{try{let s=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(s);audioChunks=[];mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);mediaRecorder.onstop=()=>{let blob=new Blob(audioChunks,{type:'audio/webm'});let R=new FileReader();R.onload=e=>{let p=currentChat==="group"?"viccks_pro_group":"viccks_pro_private_"+[myName,currentChat].sort().join("_").replace(/[^a-zA-Z0-9_]/g,"_");db.ref(p).push({name:myName,pic:myPic,text:"🎤 Voice",audio:e.target.result,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});};R.readAsDataURL(blob);s.getTracks().forEach(t=>t.stop());};mediaRecorder.start();b.innerText="⏹️";b.style.background="#ff4444";}catch(e){alert("Allow mic");}}}
function listenMessages(){let p=currentChat==="group"?"viccks_pro_group":"viccks_pro_private_"+[myName,currentChat].sort().join("_").replace(/[^a-zA-Z0-9_]/g,"_");db.ref(p).limitToLast(100).off();db.ref(p).limitToLast(100).on("value",snap=>{let h="";snap.forEach(ch=>{let m=ch.val();let k=ch.key;let mine=m.name===myName;h+=`<div class="msg ${mine?'mine':'theirs'}"><b style="font-size:11px;color:#25D366;">${mine?'You':m.name} 🇬🇭</b>${isAdmin?`<span class="del" onclick="deleteMsg('${p}','${k}')">Delete</span>`:''}<br>${(m.text||'').replace(/</g,'&lt;')}${m.img?`<img src="${m.img}">`:''}${m.audio?`<audio controls src="${m.audio}"></audio>`:''}<small style="display:block;text-align:right;color:#8696a0;font-size:10px;">${m.time||''} ✓✓</small></div>`;});let box=document.getElementById("messages");box.innerHTML=h;box.scrollTop=box.scrollHeight;});}
function deleteMsg(p,k){if(!isAdmin)return alert("Only Viccks");if(confirm("Delete?"))db.ref(p+"/"+k).remove();}
function clearAllChat(){if(!isAdmin)return alert("Login as Viccks");if(confirm("Clear ALL?")){db.ref("viccks_pro_group").remove();toggleAdmin();}}
function toggleAdmin(){let e=document.getElementById("adminPanel");e.style.display=(e.style.display==="grid"?"none":"grid");}
function openSettings(){document.getElementById("settingsModal").style.display="grid";document.getElementById("editName").value=myName;document.getElementById("editBio").value=myBio;document.getElementById("previewName").innerText=myName;document.getElementById("previewBio").innerText=myBio;let pv=document.getElementById("previewPic");if(myPic)pv.src=myPic;else pv.innerHTML=myName[0].toUpperCase();}
function closeSettings(){document.getElementById("settingsModal").style.display="none";}
function saveSettings(){let nn=document.getElementById("editName").value.trim();let nb=document.getElementById("editBio").value.trim()||"Available";let np=document.getElementById("previewPic").dataset.newPic||myPic;if(!nn)return alert("Name empty");if(nn!==myName)db.ref("viccks_users/"+myName).remove();myName=nn;myBio=nb;myPic=np;isAdmin=myName.toLowerCase()==="viccks";localStorage.setItem("viccks_name",myName);localStorage.setItem("viccks_bio",myBio);if(myPic)localStorage.setItem("viccks_pic",myPic);document.getElementById("myNameDisplay").innerText=myName;document.getElementById("myBioDisplay").innerText=myBio;let av=document.getElementById("myAvatar");if(myPic)av.src=myPic;else av.innerHTML=myName[0].toUpperCase();db.ref("viccks_users/"+myName).set({name:myName,pic:myPic,bio:myBio,online:true});closeSettings();listenUsers();}
function logout(){if(confirm("Logout?")){localStorage.clear();location.reload();}}
document.getElementById("msgInput").addEventListener("keypress",e=>{if(e.key==="Enter")sendPro();});
(function(){let sn=localStorage.getItem("viccks_name");let sb=localStorage.getItem("viccks_bio");let sp=localStorage.getItem("viccks_pic");if(sn)document.getElementById("userName").value=sn;if(sb)document.getElementById("userBio").value=sb;if(sp){let lp=document.getElementById("loginPreview");lp.src=sp;lp.style.display="grid";lp.dataset.temp=sp;}})();
document.getElementById("editPic").addEventListener("change",function(){let f=this.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{let pv=document.getElementById("previewPic");pv.src=e.target.result;pv.innerHTML="";pv.dataset.newPic=e.target.result;};r.readAsDataURL(f);});
document.getElementById("editName").addEventListener("input",function(){document.getElementById("previewName").innerText=this.value||myName;});
document.getElementById("editBio").addEventListener("input",function(){document.getElementById("previewBio").innerText=this.value||"Available";});
</script>
</body>
</html>
